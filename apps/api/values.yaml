replicaCount: 5

image:
  repository: node
  pullPolicy: IfNotPresent
  tag: "18-alpine"

service:
  type: ClusterIP
  port: 3000

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

env:
  - name: NODE_ENV
    value: "production"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: api-secrets
        key: database-url
  - name: REDIS_URL
    value: "redis://redis-service:6379"

hpa:
  enabled: true
